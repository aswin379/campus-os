<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>License Admin</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; margin: 0; padding: 32px; background: #f8fafc; color: #0f172a; }
  @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #e2e8f0; } }
  h1 { font-size: 20px; margin: 0 0 20px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; margin-bottom: 20px; max-width: 900px; }
  @media (prefers-color-scheme: dark) { .card { background: #1e293b; border-color: #334155; } }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e2e8f0; }
  @media (prefers-color-scheme: dark) { th, td { border-color: #334155; } }
  th { text-transform: uppercase; font-size: 11px; color: #64748b; }
  input, select, button { font-size: 13px; padding: 6px 8px; border-radius: 6px; border: 1px solid #cbd5e1; }
  button { cursor: pointer; background: #4f46e5; color: #fff; border-color: #4f46e5; font-weight: 600; }
  button.secondary { background: #fff; color: #0f172a; border-color: #cbd5e1; }
  @media (prefers-color-scheme: dark) { button.secondary { background: #1e293b; color: #e2e8f0; } }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge-active { background: #dcfce7; color: #16a34a; }
  .badge-suspended { background: #fef3c7; color: #d97706; }
  .badge-cancelled { background: #fee2e2; color: #dc2626; }
  .muted { color: #64748b; font-size: 12px; }
  #error { color: #dc2626; margin-bottom: 12px; }
</style>
</head>
<body>
  <h1>License Admin</h1>
  <div id="error"></div>

  <div class="card">
    <h3 style="margin-top:0">Issue new license</h3>
    <div class="row">
      <input id="newClientName" placeholder="Client name" style="flex:1; min-width:200px" />
      <input id="newDays" type="number" value="365" style="width:90px" title="Valid for (days)" />
      <button onclick="createLicense()">Create</button>
    </div>
    <div id="newLicenseResult" class="muted"></div>
  </div>

  <div class="card">
    <h3 style="margin-top:0">Licenses</h3>
    <table>
      <thead>
        <tr>
          <th>Client</th>
          <th>License Key</th>
          <th>Status</th>
          <th>Expires</th>
          <th>Last Seen</th>
          <th>Instance ID</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="licenseRows"></tbody>
    </table>
  </div>

<script>
  let token = localStorage.getItem('licenseAdminToken') || '';

  async function api(path, options = {}) {
    if (!token) {
      token = prompt('Admin token:') || '';
      localStorage.setItem('licenseAdminToken', token);
    }
    const res = await fetch(path, {
      ...options,
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...options.headers },
    });
    if (res.status === 401) {
      localStorage.removeItem('licenseAdminToken');
      token = '';
      throw new Error('Invalid admin token — refresh and try again.');
    }
    const body = await res.json().catch(() => null);
    if (!res.ok) throw new Error(body?.error || res.statusText);
    return body;
  }

  function showError(err) {
    document.getElementById('error').textContent = err instanceof Error ? err.message : String(err);
  }

  function fmtDate(s) {
    return s ? new Date(s).toISOString().slice(0, 10) : '—';
  }

  async function loadLicenses() {
    document.getElementById('error').textContent = '';
    try {
      const licenses = await api('/api/v1/admin/licenses');
      const rows = document.getElementById('licenseRows');
      rows.innerHTML = '';
      for (const l of licenses) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${l.client_name}</td>
          <td><code style="font-size:11px">${l.license_key}</code></td>
          <td><span class="badge badge-${l.status}">${l.status}</span></td>
          <td>${fmtDate(l.expires_at)}</td>
          <td>${fmtDate(l.last_seen_at)}</td>
          <td class="muted">${l.last_seen_instance_id ?? '—'}</td>
          <td>
            <button class="secondary" onclick="renew('${l.license_key}')">+365d</button>
            <button class="secondary" onclick="toggleSuspend('${l.license_key}', '${l.status}')">${l.status === 'active' ? 'Suspend' : 'Activate'}</button>
          </td>
        `;
        rows.appendChild(tr);
      }
    } catch (err) {
      showError(err);
    }
  }

  async function createLicense() {
    const clientName = document.getElementById('newClientName').value.trim();
    const days = Number(document.getElementById('newDays').value) || 365;
    if (!clientName) return showError('Client name is required');
    try {
      const created = await api('/api/v1/admin/licenses', { method: 'POST', body: JSON.stringify({ clientName, days }) });
      document.getElementById('newLicenseResult').textContent =
        `Created — license key: ${created.license_key} (put this in the client's LICENSE_KEY env var)`;
      document.getElementById('newClientName').value = '';
      await loadLicenses();
    } catch (err) {
      showError(err);
    }
  }

  async function renew(licenseKey) {
    try {
      await api(`/api/v1/admin/licenses/${licenseKey}`, { method: 'PATCH', body: JSON.stringify({ extendDays: 365 }) });
      await loadLicenses();
    } catch (err) {
      showError(err);
    }
  }

  async function toggleSuspend(licenseKey, currentStatus) {
    const status = currentStatus === 'active' ? 'suspended' : 'active';
    try {
      await api(`/api/v1/admin/licenses/${licenseKey}`, { method: 'PATCH', body: JSON.stringify({ status }) });
      await loadLicenses();
    } catch (err) {
      showError(err);
    }
  }

  loadLicenses();
</script>
</body>
</html>
