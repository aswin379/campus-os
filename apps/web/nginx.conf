server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing: unknown paths fall back to index.html so
    # React Router (not nginx) resolves e.g. /students/:id on a hard refresh.
    location / {
        try_files $uri /index.html;
    }
}
